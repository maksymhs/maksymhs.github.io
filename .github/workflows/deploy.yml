name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Cloudflare serves /assets with a 4 hour browser cache: version the URLs so a new deploy is picked up at once.
      - name: Cache-bust assets
        run: |
          v=$(cat site/assets/site.js site/assets/site.css | sha256sum | cut -c1-8)
          find site -name '*.html' -exec sed -i -E "s#/assets/(site\.(js|css))(\?v=[a-z0-9]+)?\"#/assets/\1?v=$v\"#g" {} +
          grep -o "/assets/site\.[a-z]*?v=$v" site/index.html | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

name = "api"
main = "src/index.js"
compatibility_date = "2025-09-01"

routes = [{ pattern = "api.maksym.site", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://maksym.site"
PROFILE_URL = "https://maksym.site/llms-full.txt"
CF_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
LLM_URL = "https://openrouter.ai/api/v1/chat/completions"
LLM_MODEL = "google/gemma-4-31b-it:free"
LLM_MODELS = "google/gemma-4-26b-a4b-it:free,minimax/minimax-m3.1-flash:free,poolside/laguna-s-2.1:free,nvidia/nemotron-3.5-lightning:free,nvidia/nemotron-3-super-120b-a12b:free"
NOTIFY_CHAT = "false"

[ai]
binding = "AI"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
